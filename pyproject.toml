[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "kicad-sch-reader"
version = "0.1.0"
description = "Pure-Python KiCad schematic (.kicad_sch) reader with connectivity netlist and design-review rules"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [{name = "schematics_review_tool"}]
keywords = ["kicad", "schematic", "erc", "netlist", "design-review"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Electronic Design Automation (EDA)",
]
dependencies = []

[project.scripts]
kicad-sch-reader = "kicad_sch_reader.cli:main"

[tool.setuptools.packages.find]
include = ["kicad_sch_reader*"]
